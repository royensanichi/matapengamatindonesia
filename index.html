  <title>MataPengamat — Pilih Isu</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root { color-scheme: dark; --bg: #101012; --red: #ed383c; --white: #fff; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--white); font-family: 'DM Sans', system-ui, -apple-system, sans-serif; overflow: hidden; }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: -8px; }

    .app { position: relative; height: 100vh; height: 100dvh; min-height: 380px; isolation: isolate; }
    .split { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); height: 100%; }

    .portal {
      position: relative; min-width: 0; height: 100%; border: 0; padding: 0;
      isolation: isolate; overflow: hidden; cursor: pointer; color: inherit;
      display: flex; align-items: center; justify-content: center;
      background: #191b1c; text-align: center; -webkit-tap-highlight-color: transparent;
    }
    .portal--karhutla { background: #251a19; }

    .portal__photo, .portal__shade, .portal__texture, .portal__outline {
      position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
    }
    .portal__photo {
      object-fit: cover; object-position: center; z-index: -4;
      transform: scale(1.015); filter: brightness(.67) saturate(.89);
      transition: transform .9s cubic-bezier(.2,.8,.2,1), filter .75s ease;
    }
    .portal--mbg .portal__photo { object-position: 49% 50%; }
    .portal--karhutla .portal__photo { object-position: 56% center; }
    .portal__shade { z-index: -3; background: linear-gradient(180deg, rgba(5,6,8,.64) 0%, rgba(9,9,10,.25) 26%, rgba(9,9,10,.33) 49%, rgba(5,6,8,.67) 100%); transition: opacity .75s ease; }
    .portal--mbg .portal__shade { background: linear-gradient(180deg,rgba(5,10,8,.60), rgba(10,18,15,.34) 43%,rgba(5,9,9,.76)); }
    .portal--karhutla .portal__shade { background: linear-gradient(180deg,rgba(14,8,8,.61), rgba(21,10,9,.27) 43%,rgba(12,7,7,.76)); }
    .portal__texture { z-index: -2; opacity: .36; background: radial-gradient(ellipse 62% 57% at 50% 51%, transparent 20%, rgba(0,0,0,.42) 100%); }
    .portal__outline { z-index: 4; border: 1px solid rgba(255,255,255,.07); transition: border-color .4s ease, box-shadow .4s ease; }
    .portal--mbg .portal__outline { border-right: 1px solid rgba(255,255,255,.23); }

    .portal__content {
      position: relative; z-index: 3; width: min(100%, 710px); padding: 24px clamp(22px, 5vw, 92px);
      transform: translateY(14px); transition: transform .6s cubic-bezier(.19,1,.22,1);
      display: flex; flex-direction: column; align-items: center;
    }
    .portal__index { font-size: 11px; font-weight: 800; letter-spacing: .35em; text-transform: uppercase; color: rgba(255,255,255,.84); margin-bottom: 23px; }
    .portal__accent { width: 32px; height: 3px; background: var(--red); box-shadow: 0 0 15px rgba(237,56,60,.6); margin-bottom: 26px; border-radius: 2px; }
    .portal__title {
      font-family: 'Manrope', system-ui, sans-serif; font-weight: 800;
      font-size: clamp(43px, 5.4vw, 88px); line-height: 1.045; letter-spacing: -.062em;
      text-wrap: balance; margin: 0; text-shadow: 0 4px 30px rgba(0,0,0,.24);
    }
    .portal--karhutla .portal__title { font-size: clamp(44px, 5.55vw, 90px); }
    .portal__title span { display: block; }
    .portal__year { display: inline-block!important; color: rgba(255,255,255,.96); }
    .portal__desc { max-width: 365px; margin: 23px 0 32px; font-size: clamp(14px,1.18vw,17px); line-height: 1.8; font-weight: 500; color: rgba(255,255,255,.8); text-wrap: balance; }
    .portal__action {
      display: inline-flex; gap: 14px; align-items: center; justify-content: center;
      background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.38);
      padding: 14px 18px 14px 23px; border-radius: 100px;
      font-size: 13px; font-weight: 800; letter-spacing: .04em;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: background .4s ease, border-color .4s ease, transform .4s ease;
    }
    .portal__arrow { width: 23px; height: 23px; display: grid; place-items: center; background: var(--red); border-radius: 50%; transition: transform .4s ease; }
    .portal__arrow svg { width: 13px; height: 13px; }

    .portal__foot {
      position: absolute; z-index: 3; bottom: clamp(27px,4.8vh,52px);
      left: 0; width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 9px; color: rgba(255,255,255,.74); font-size: 10px; letter-spacing: .21em;
      font-weight: 800; text-transform: uppercase;
    }
    .foot-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); }

    .brand {
      position: absolute; top: clamp(30px,6vh,66px); left: 50%; transform: translateX(-50%);
      z-index: 8; display: flex; flex-direction: column; align-items: center; pointer-events: none;
      text-align: center; width: max-content; max-width: 94vw; filter: drop-shadow(0 4px 20px rgba(0,0,0,.45));
    }
    .brand__row { display: flex; align-items: center; justify-content: center; gap: 10px; }
    /* Ikon original MataPengamat dari website MBG, tanpa kotak latar. */
    .brand__icon { display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 40px; flex: 0 0 auto; }
    .brand__icon img { width: 60px; height: 40px; display: block; object-fit: contain; transform-origin: center; animation: mataEyeOpen .85s cubic-bezier(.22,.7,.25,1) both, mataEyeBlink 7s .85s infinite; }
    @keyframes mataEyeOpen { 0%,15% { transform:scaleY(.055) } 100% {transform:scaleY(1)} }
    @keyframes mataEyeBlink { 0%,92%,100% {transform:scaleY(1)} 95% {transform:scaleY(.055)} 98% {transform:scaleY(1)} }
    .brand__wordmark { font-family: 'Manrope', system-ui, sans-serif; font-size: clamp(21px, 2vw, 29px); letter-spacing: -.055em; font-weight: 800; }
    .brand__subtitle { margin-top: 11px; font-size: 10px; font-weight: 800; letter-spacing: .25em; text-transform: uppercase; color: rgba(255,255,255,.68); }
    .bottom-note { position: absolute; z-index: 8; bottom: 13px; left: 50%; transform: translateX(-50%); font-size: 9px; letter-spacing: .04em; color: rgba(255,255,255,.6); white-space: nowrap; }
    .bottom-note a { color: inherit; text-underline-offset: 2px; }
    .bottom-note a:hover { color: #fff; }

    /* Brighter photo, slight zoom, stronger outline, and raised text on hover. */
    @media (hover: hover) and (pointer: fine) {
      .portal:hover .portal__photo { transform: scale(1.085); filter: brightness(.99) saturate(1.07); }
      .portal:hover .portal__shade { opacity: .73; }
      .portal:hover .portal__content { transform: translateY(0); }
      .portal:hover .portal__outline { border-color: rgba(255,255,255,.36); box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); }
      .portal:hover .portal__action { background: rgba(255,255,255,.21); border-color: rgba(255,255,255,.65); transform: translateY(-2px); }
      .portal:hover .portal__arrow { transform: translateX(4px); }
      .split:hover .portal:not(:hover) .portal__photo { filter: brightness(.46) saturate(.73); }
    }
    .portal:active .portal__photo { transform: scale(1.035); }

    .toast { position: fixed; z-index: 30; left: 50%; bottom: 36px; transform: translate(-50%,18px); opacity: 0; pointer-events: none; background: #f9f9fa; color: #1d1d20; border-radius: 14px; padding: 13px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.4); font-size: 13px; font-weight: 700; text-align: center; min-width: 230px; max-width: calc(100vw - 35px); transition: opacity .25s ease, transform .25s ease; }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 700px) {
      .app { min-height: 0; }
      .split { grid-template-columns: 1fr; grid-template-rows: minmax(0,1fr) minmax(0,1fr); }
      .brand { top: 16px; }
      .brand__icon { width: 47px; height: 31px; }
      .brand__icon img { width: 47px; height: 31px; }
      .brand__wordmark { font-size: 20px; }
      .brand__subtitle { font-size: 8px; margin-top: 4px; letter-spacing: .18em; }
      .portal__content { padding: 16px 18px; transform: translateY(10px); }
      .portal--mbg .portal__content { padding-top: 44px; }
      .portal__index { margin-bottom: 9px; font-size: 8px; letter-spacing: .23em; }
      .portal__accent { width: 25px; margin-bottom: 11px; height: 2px; }
      .portal__title, .portal--karhutla .portal__title { font-size: clamp(32px,8.4vw,46px); letter-spacing: -.065em; }
      .portal__desc { font-size: 12px; line-height: 1.5; max-width: 285px; margin: 11px 0 14px; }
      .portal__action { font-size: 10px; padding: 8px 11px 8px 15px; gap: 10px; }
      .portal__arrow { width: 20px; height: 20px; }
      .portal__foot { bottom: 10px; font-size: 7px; gap: 6px; letter-spacing: .15em; }
      .portal--mbg .portal__outline { border-right: none; border-bottom: 1px solid rgba(255,255,255,.3); }
      .bottom-note { display: none; }
      .toast { bottom: 18px; }
    }
    @media (max-height: 650px) and (min-width: 701px) {
      .brand { top: 18px; }
      .brand__subtitle { margin-top: 4px; }
      .portal__index { margin-bottom: 12px; }
      .portal__accent { margin-bottom: 13px; }
      .portal__title, .portal--karhutla .portal__title { font-size: clamp(34px, 5vw, 70px); }
      .portal__desc { margin: 13px 0 16px; }
      .portal__foot { bottom: 18px; }
    }
    @media (max-height: 680px) and (max-width: 700px) {
      .brand { top: 9px; }
      .brand__subtitle { display: none; }
      .portal--mbg .portal__content { padding-top: 35px; }
      .portal__index { display: none; }
      .portal__accent { margin-bottom: 8px; }
      .portal__title, .portal--karhutla .portal__title { font-size: clamp(28px,8vw,39px); }
      .portal__desc { font-size: 11px; margin: 8px 0; }

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>

    // Selalu ulangi fade-in saat landing dibuka, termasuk via tombol Back (BFCache).
    window.addEventListener('pageshow', () => {
      const root = document.documentElement;
      root.classList.remove('landing-enter');
      void document.querySelector('.app').offsetWidth;
      root.classList.add('landing-enter');
    });
    // Dua halaman asli berada dalam paket website yang sama.
    const routes = { mbg: './MBG.html', karhutla: './Karhutla.html' };
    const toast = document.getElementById('toast');
    let toastTimer;

    document.querySelectorAll('[data-portal]').forEach((button) => {
      button.addEventListener('click', () => {
        const id = button.dataset.portal;
        if (routes[id]) {
          window.location.href = routes[id];
          return;
        }
        toast.textContent = `Halaman ${id === 'mbg' ? 'MBG' : 'Karhutla'} belum dihubungkan.`;
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2300);
      });
    });
  </script>
